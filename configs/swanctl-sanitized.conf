# Sanitized strongSwan configuration
# Enterprise Healthcare Hybrid Cloud Architecture
#
# Authentication secrets have intentionally been removed.
# Example values should be replaced for an actual deployment.

connections {

    Tunnel1 {
        version = 1
        local_addrs  = <CUSTOMER_GATEWAY_PRIVATE_IP>
        remote_addrs = <AWS_TUNNEL_1_OUTSIDE_IP>

        proposals = aes128-sha1-modp1024

        local {
            auth = psk
            id = <CUSTOMER_GATEWAY_PUBLIC_IP>
        }

        remote {
            auth = psk
            id = <AWS_TUNNEL_1_OUTSIDE_IP>
        }

        dpd_delay = 10s
        dpd_timeout = 30s

        children {

            Tunnel1-child {
                local_ts  = 0.0.0.0/0
                remote_ts = 0.0.0.0/0

                esp_proposals = aes128-sha1-modp1024

                mode = tunnel
                start_action = start
                dpd_action = restart

                mark_in  = 100
                mark_out = 100
            }
        }
    }

    Tunnel2 {
        version = 1
        local_addrs  = <CUSTOMER_GATEWAY_PRIVATE_IP>
        remote_addrs = <AWS_TUNNEL_2_OUTSIDE_IP>

        proposals = aes128-sha1-modp1024

        local {
            auth = psk
            id = <CUSTOMER_GATEWAY_PUBLIC_IP>
        }

        remote {
            auth = psk
            id = <AWS_TUNNEL_2_OUTSIDE_IP>
        }

        dpd_delay = 10s
        dpd_timeout = 30s

        children {

            Tunnel2-child {
                local_ts  = 0.0.0.0/0
                remote_ts = 0.0.0.0/0

                esp_proposals = aes128-sha1-modp1024

                mode = tunnel
                start_action = start
                dpd_action = restart

                mark_in  = 200
                mark_out = 200
            }
        }
    }
}

secrets {

    ike-Tunnel1 {
        id-1 = <CUSTOMER_GATEWAY_PUBLIC_IP>
        id-2 = <AWS_TUNNEL_1_OUTSIDE_IP>

        # Never commit the real PSK
        secret = "<REDACTED>"
    }

    ike-Tunnel2 {
        id-1 = <CUSTOMER_GATEWAY_PUBLIC_IP>
        id-2 = <AWS_TUNNEL_2_OUTSIDE_IP>

        # Never commit the real PSK
        secret = "<REDACTED>"
    }
}
